{% extends "base.html" %}
{% block title %}404 - Page Not Found - {{ t('app_name') }}{% endblock %}

{% block content %}
<div class="glass-panel text-center py-5 my-5 mx-auto" style="max-width: 580px;">
    <span class="display-1 d-block mb-3">🌿</span>
    <h1 class="display-5 fw-bold text-success">404</h1>
    <h4 class="fw-bold mb-3">Page Not Found</h4>
    <p class="text-secondary small mb-4">
        {{ message or "The page or agricultural resource you are looking for does not exist or has been relocated." }}
    </p>
    <a href="{{ url_for('index') }}" class="btn-agri-primary">
        <span>🏠</span> {{ t('nav_home') }}
    </a>
</div>
{% endblock %}
